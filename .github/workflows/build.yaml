name: Build and package

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: true

jobs:
  docker-image:
    name: Docker image
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.aqbanking.outputs.version }}

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to container registry
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read AqBanking version
        id: aqbanking
        run: |
          version="$(sed --quiet 's/^ARG AQBANKING_VERSION=//p' Dockerfile)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata from build
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Generate Docker tags based on the following events/attributes.
          # https://github.com/docker/metadata-action#tags-input
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # Set version and latest tags for the default branch.
            type=raw,value=${{ steps.aqbanking.outputs.version }},enable={{ is_default_branch }}
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event_name != 'pull_request' ||
                github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    runs-on: ubuntu-latest

    needs:
      - docker-image

    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.4.0
        with:
          mode: COMMIT
          toTag: ${{ github.sha }}
          failOnError: true

      - name: Create release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.docker-image.outputs.version }}
          name: ${{ needs.docker-image.outputs.version }}
          commit: ${{ github.sha }}
          body: ${{ steps.changelog.outputs.changelog }}
          skipIfReleaseExists: true
          makeLatest: true
